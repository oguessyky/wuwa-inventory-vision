[[package]]
name = "wuwa-vision"
version = "1.0.3"
source = { editable = "." }
dependencies = [
    { name = "fastapi" },
    { name = "numpy" },
    { name = "opencv-python-headless" },
    { name = "pillow" },
    { name = "pydantic" },
    { name = "pydantic-settings" },
    { name = "pypinyin" },
    { name = "rapidocr-onnxruntime" },
    { name = "uvicorn", extra = ["standard"] },
]

[package.optional-dependencies]
capture = [
    { name = "pywin32", marker = "sys_platform == 'win32'" },
    { name = "windows-capture", marker = "sys_platform == 'win32'" },
]
capture-macos = [
    { name = "pyobjc-framework-cocoa", marker = "sys_platform == 'darwin'" },
    { name = "pyobjc-framework-quartz", marker = "sys_platform == 'darwin'" },
]
recognition = [
    { name = "scikit-image" },
    { name = "torch" },
    { name = "torchvision" },
    { name = "transformers" },
]

[package.dev-dependencies]
dev = [
    { name = "pytest" },
    { name = "ruff" },
]

[package.metadata]
requires-dist = [
    { name = "fastapi", specifier = ">=0.115" },
    { name = "numpy", specifier = ">=2.1" },
    { name = "opencv-python-headless", specifier = ">=4.10" },
    { name = "pillow", specifier = ">=11" },
    { name = "pydantic", specifier = ">=2.9" },
    { name = "pydantic-settings", specifier = ">=2.6" },
    { name = "pyobjc-framework-cocoa", marker = "sys_platform == 'darwin' and extra == 'capture-macos'", specifier = ">=10.3" },
    { name = "pyobjc-framework-quartz", marker = "sys_platform == 'darwin' and extra == 'capture-macos'", specifier = ">=10.3" },
    { name = "pypinyin", specifier = ">=0.50" },
    { name = "pywin32", marker = "sys_platform == 'win32' and extra == 'capture'", specifier = ">=306" },
    { name = "rapidocr-onnxruntime", specifier = ">=1.4" },
    { name = "scikit-image", marker = "extra == 'recognition'", specifier = ">=0.24" },
    { name = "torch", marker = "extra == 'recognition'", specifier = ">=2.7", index = "https://download.pytorch.org/whl/cu128" },
    { name = "torchvision", marker = "extra == 'recognition'", specifier = ">=0.22", index = "https://download.pytorch.org/whl/cu128" },
    { name = "transformers", marker = "extra == 'recognition'", specifier = ">=4.45" },
    { name = "uvicorn", extras = ["standard"], specifier = ">=0.32" },
    { name = "windows-capture", marker = "sys_platform == 'win32' and extra == 'capture'", specifier = ">=2.0" },
]
provides-extras = ["capture", "capture-macos", "recognition"]

[package.metadata.requires-dev]
dev = [
    { name = "pytest", specifier = ">=8.3" },
    { name = "ruff", specifier = ">=0.7" },
]
