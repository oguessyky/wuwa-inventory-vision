# The home's image (PLAN.md D183): built on each release of the public repository, for amd64
# and arm64, and published to its packages. What is built is exactly what a NAS builds from
# source: the app/ folder tools/make_nas_bundle.py lays out -- code, the built pages and the
# names that ship; never data, never a game picture.
#
# Kept in the private repository too, where it does nothing (the `if` below).
name: home image

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "image tag to publish (default: the project's version)"
        required: false

permissions:
  contents: read
  packages: write

jobs:
  image:
    if: github.repository == 'oguessyky/wuwa-inventory-vision'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: the version
        id: version
        env:
          ASKED: ${{ github.event.inputs.tag }}
          RELEASED: ${{ github.event.release.tag_name }}
        run: |
          v=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          # a release's own name (v1.0.4, v1.0.4-rc1) without the v; else what was asked; else the project's
          tag=${RELEASED#v}
          echo "version=${tag:-${ASKED:-$v}}" >> "$GITHUB_OUTPUT"
      - name: lay out what is built (app/)
        run: python tools/make_nas_bundle.py "$RUNNER_TEMP/home"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ runner.temp }}/home/app
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/oguessyky/wuwa-inventory-vision-home:${{ steps.version.outputs.version }}
            ${{ github.event_name == 'release' && !github.event.release.prerelease && 'ghcr.io/oguessyky/wuwa-inventory-vision-home:latest' || '' }}
