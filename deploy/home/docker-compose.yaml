# The home, ready-made (PLAN.md D183): the dashboard from the published image, and Tailscale
# beside it. Nothing is built here and nothing is typed on the NAS:
#
#   1. copy .env.example to .env and put your Tailscale auth key in it
#   2. in the NAS's Docker app: Project -> create, in this folder, with this file -> deploy
#      (or, anywhere with Docker: docker compose up -d)
#   3. open http://<TS_HOSTNAME>.<your tailnet>.ts.net:4000 on a device of your tailnet
#
# The app listens on 127.0.0.1 and nothing else, and no port is published: it shares the
# network of the Tailscale container beside it, whose Serve (tailscale/serve.json) is the
# only way in -- from your own tailnet, never funnel. That Tailscale is a device of its own
# on your tailnet (TS_HOSTNAME); a Tailscale already on this machine is not touched.
#
# Updating: the Docker app's update, or `docker compose pull && docker compose up -d`. Pin a
# version with WUWA_VERSION in .env; update the scanner to the same one.
services:
  tailscale:
    image: tailscale/tailscale:v1.102.5
    container_name: ${WUWA_NAME:-wuwa-home}-tailscale
    hostname: ${TS_HOSTNAME:-wuwa-home}
    restart: unless-stopped
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:?put your Tailscale auth key in .env (see .env.example)}
      TS_HOSTNAME: ${TS_HOSTNAME:-wuwa-home}
      # logged in with the key once; after that the state below is what counts
      TS_AUTH_ONCE: "true"
      TS_STATE_DIR: /var/lib/tailscale
      # its own network stack in this container: no /dev/net/tun, no NET_ADMIN
      TS_USERSPACE: "true"
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - ./tailscale-state:/var/lib/tailscale
      # a folder, not the file: a change to serve.json is then picked up
      - ./tailscale:/config:ro

  wuwa:
    image: ${WUWA_IMAGE:-ghcr.io/oguessyky/wuwa-inventory-vision-home}:${WUWA_VERSION:-latest}
    container_name: ${WUWA_NAME:-wuwa-home}
    restart: unless-stopped
    network_mode: service:tailscale
    depends_on:
      - tailscale
    volumes:
      # the database, the scan crops, the catalogue and the upload key (home.key)
      - ${WUWA_DATA:-./data}:/app/data
      # read once, on the very first start, if it is there (a copy of a home moved here)
      - ./seed-data:/seed:ro
